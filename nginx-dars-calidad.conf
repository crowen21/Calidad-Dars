# Copiar a /etc/nginx/sites-available/dars-calidad
# y luego: sudo ln -s /etc/nginx/sites-available/dars-calidad /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name _;   # reemplazar por el subdominio si se usa uno

    root /var/www/dars-calidad;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Alias: mismo dashboard accesible también en /CalidadDars
    location = /CalidadDars {
        return 301 /CalidadDars/;
    }
    location /CalidadDars/ {
        alias /var/www/dars-calidad/;
        index index.html;
        try_files $uri $uri/ /CalidadDars/index.html;
    }

    # El backend corre local en :8001 (uvicorn), nginx lo expone bajo /api/calidad-agentes
    location /api/calidad-agentes/ {
        proxy_pass http://127.0.0.1:8001/api/calidad-agentes/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
