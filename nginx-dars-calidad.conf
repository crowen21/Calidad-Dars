# Copia real del server block activo en el EC2 (/etc/nginx/sites-available/dars-calidad).
# Se actualiza acá para que quede documentado, pero el archivo que manda es el del servidor:
# si necesitás volver a copiarlo (ej. instancia nueva), hacelo desde un backup del EC2, no
# generes el bloque SSL a mano — esas líneas las gestiona Certbot.
#
# Nota: este server comparte el EC2 con otro proyecto (sedación paliativa domiciliaria, :8000),
# de ahí el segundo location /api/. No lo toques al editar rutas de Calidad DARS.

server {
    server_name 44-200-34-13.sslip.io;
    root /var/www/dars-calidad;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
    # Alias: mismo dashboard accesible también en /Calidad
    location = /Calidad {
        return 301 /Calidad/;
    }
    location /Calidad/ {
        alias /var/www/dars-calidad/;
        index index.html;
        try_files $uri $uri/ /Calidad/index.html;
    }
    # Alias: mismo dashboard accesible también en /CalidadDars
    location = /CalidadDars {
        return 301 /CalidadDars/;
    }
    location /CalidadDars/ {
        alias /var/www/dars-calidad/;
        index index.html;
        try_files $uri $uri/ /CalidadDars/index.html;
    }
    # El backend de Calidad DARS corre local en :8001
    location /api/calidad-agentes/ {
        proxy_pass http://127.0.0.1:8001/api/calidad-agentes/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # Backend de sedación paliativa domiciliaria, corre local en :8000
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/44-200-34-13.sslip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/44-200-34-13.sslip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = 44-200-34-13.sslip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    listen 80;
    server_name 44-200-34-13.sslip.io;
    return 301 https://44-200-34-13.sslip.io$request_uri;
}
